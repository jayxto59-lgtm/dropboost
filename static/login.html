<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropBoost – Connexion</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login card" id="f">
    <span class="logo big">D</span>
    <h1>DropBoost</h1>
    <p>Entre le mot de passe pour ouvrir ta boutique.</p>
    <label>Mot de passe<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
    <button class="primary big" type="submit">Entrer</button>
    <p class="form-err" id="err"></p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      if (r.ok) location.href = '/' + location.hash; // garde un produit envoyé par l'extension
      else err.textContent = (await r.json().catch(() => ({}))).error || 'Erreur, réessaie.';
    });
  </script>
</body>
</html>
