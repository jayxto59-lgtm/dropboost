services:
  - type: web
    name: dropboost
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 240 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_RUNAME
        sync: false
      - key: EBAY_MARKETPLACE
        value: EBAY_FR
      - key: ETSY_KEYSTRING
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
